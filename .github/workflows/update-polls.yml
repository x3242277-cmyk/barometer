name: עדכון סקרים יומי
on:
  schedule:
    - cron: "0 5 * * *"      # 08:00 שעון ישראל (05:00 UTC)
  workflow_dispatch:          # אפשר גם להריץ ידנית מלשונית Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: שליפת סקרים חדשים
        run: node scripts/update-polls.mjs
      - name: קומיט אם השתנה משהו
        run: |
          git config user.name  "barometer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/current-polls.json data/polls-archive.json
          git diff --staged --quiet || git commit -m "עדכון אוטומטי של סקרי 14 הימים האחרונים"
          git push
