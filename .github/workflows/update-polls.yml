name: עדכון סקרים

# היעד: עדכון אחד ב-09:00 ואחד ב-21:00 שעון ישראל, כל יום, כל השנה.
#
# ל-cron של GitHub אין אזור זמן (הכול UTC), הוא לא יודע על מעבר שעון, והכי
# חשוב — הוא *לא מתחייב לזמן*: הרצות מתוזמנות מתעכבות בשעות עומס ולפעמים
# לא נורות בכלל. לכן הוא לא הטריגר הראשי כאן.
#
#   טריגר ראשי  — שירות cron חיצוני שקורא ל-API של workflow_dispatch
#                  בדיוק ב-09:00 וב-21:00 שעון ישראל.
#   רשת ביטחון  — ה-cron שלמטה, ניסיון כל 20 דקות בחלון שמכסה את היעד
#                  גם בקיץ (UTC+3) וגם בחורף (UTC+2), ועוד שעתיים השלמה.
#
# שלב השער מחשב את שעון ישראל ומשייך כל הרצה ל"משבצת" (למשל
# 2026-09-07-morning). הרצה שמצליחה נועלת את המשבצת ב-actions/cache — לא
# משנה מי הפעיל אותה — וכל השאר מדלגות. כך העדכון קורה פעם אחת בדיוק לכל
# משבצת: אם הטריגר החיצוני עבד, רשת הביטחון רואה נעילה ומדלגת; אם הוא
# שתק, היא עושה את העבודה. הנעילה נשמרת רק אחרי הצלחה, כך שכישלון מזמן
# ניסיון חוזר בעוד 20 דקות במקום לאבד את המשבצת.

on:
  schedule:
    #        קיץ (UTC+3)      חורף (UTC+2)
    # 6  →   09:00 ✓          08:00 ✗
    # 7  →   10:00 (השלמה)    09:00 ✓
    # 8  →   11:00 (השלמה)    10:00 (השלמה)
    # 9  →   12:00 ✗          11:00 (השלמה)
    - cron: "4,24,44 6-9 * * *"     # בוקר — 09:00 שעון ישראל
    - cron: "4,24,44 18-21 * * *"   # ערב  — 21:00 שעון ישראל
  # הטריגר הראשי (שירות cron חיצוני) וגם הרצה ידנית מלשונית Actions.
  # תמיד רץ — בלי בדיקת שעה ובלי בדיקת נעילה — אבל *כן* נועל את המשבצת
  # אם הוא נפל בתוך אחד החלונות, כדי שרשת הביטחון לא תעבוד פעמיים.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  # ── שער: להחליט אם הניסיון הזה הוא זה שיעשה את העבודה ──────────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      slot:    ${{ steps.window.outputs.slot }}
    steps:
      - name: לאיזו משבצת שייכת השעה בישראל
        id: window
        run: |
          now=$(TZ=Asia/Jerusalem date '+%F %H')
          day=${now% *}
          hour=${now#* }

          case "$hour" in
            09|10|11) slot="$day-morning" ;;
            21|22|23) slot="$day-evening" ;;
            *)        slot="" ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then manual=yes; else manual=no; fi
          echo "manual=$manual" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

          echo "השעה בישראל: $day $hour:00 · הרצה ידנית: $manual"
          if [ -n "$slot" ]; then
            echo "משבצת: $slot"
          else
            echo "מחוץ לחלונות 09:00–11:59 ו-21:00–23:59 — אין משבצת לנעול"
          fi

      - name: האם המשבצת כבר בוצעה
        id: lock
        if: steps.window.outputs.slot != ''
        uses: actions/cache/restore@v4
        with:
          path: .slot-marker
          key: poll-slot-${{ steps.window.outputs.slot }}
          lookup-only: true

      - name: החלטה
        id: decide
        env:
          MANUAL: ${{ steps.window.outputs.manual }}
          SLOT:   ${{ steps.window.outputs.slot }}
          HIT:    ${{ steps.lock.outputs.cache-hit }}
        run: |
          if [ "$MANUAL" = "yes" ]; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          elif [ -z "$SLOT" ]; then
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          elif [ "$HIT" = "true" ]; then
            echo "proceed=no" >> "$GITHUB_OUTPUT"
            echo "המשבצת $SLOT כבר בוצעה בניסיון קודם — מדלג"
          else
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
            echo "המשבצת $SLOT עוד לא בוצעה — רץ"
          fi

  # ── העבודה עצמה ────────────────────────────────────────────────────────
  update:
    needs: gate
    if: needs.gate.outputs.proceed == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: שליפת סקרים חדשים מ-skarim.org
        run: node scripts/update-polls.mjs

      - name: בנייה מחדש של הקובץ היחיד ב-dist
        run: node scripts/build-single-file.mjs

      - name: קומיט אם השתנה משהו
        run: |
          git config user.name  "barometer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/current-polls.json data/polls-archive.json dist/index.html dist/artifact.html
          if git diff --staged --quiet; then
            echo "אין שינוי בסקרים — אין מה לקמט"
            exit 0
          fi
          git commit -m "עדכון אוטומטי של הסקרים ($(TZ=Asia/Jerusalem date '+%d.%m.%Y %H:%M'))"
          # master יכול היה לזוז מאז ה-checkout — למשוך לפני הדחיפה
          git pull --rebase origin master
          git push

      # רק אחרי הצלחה. אם משהו קרס — המשבצת נשארת פתוחה והניסיון הבא,
      # בעוד 20 דקות, ינסה שוב.
      - name: נעילת המשבצת
        if: needs.gate.outputs.slot != ''
        run: date -u > .slot-marker
      - name: שמירת הנעילה
        if: needs.gate.outputs.slot != ''
        uses: actions/cache/save@v4
        with:
          path: .slot-marker
          key: poll-slot-${{ needs.gate.outputs.slot }}
